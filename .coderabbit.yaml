# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: 'ko-KR'
early_access: false
# 리뷰 톤/스타일 지침
tone_instructions: >
  친절하고 건설적인 톤으로 리뷰해주세요. 목표는 작성자의 코드 품질을 개선하며 성장하도록 돕는 것입니다. 문제점을 지적할 때는 개선 방안도 함께 제시해주세요.
  1. 칭찬을 남발하지 마세요. 칭찬은 짧고 위트 있게 작성하세요.
  2. 피드백은 명확하고 구체적이어야 하며, 문제의 원인과 개선 방법을 반드시 제시하세요.
  3. 비판보다는 개선 중심의 제안을 우선하세요.
  4. 리뷰는 교육적이어야 하며, 관련 개념이나 공식 문서를 함께 추천하세요.

reviews:
  profile: 'chill'
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  abort_on_close: true # PR이 닫히면 진행 중인 리뷰 중단

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true

  # 사용할 정적 분석 도구 설정
  tools:
    eslint:
      enabled: true
    biome:
      enabled: false
    github-checks:
      enabled: false

  # 특정 경로에 대한 리뷰 지침
  path_instructions:
    - path: 'src/shared/ui/**'
      instructions: '공통 UI 컴포넌트입니다. 재사용성, Props 타입 정의를 중점적으로 검토해주세요.'
    - path: 'src/features/**/api/**'
      instructions: 'API 레이어입니다. 에러 핸들링, 타입 안전성, React Query 사용 패턴을 검토해주세요.'
    - path: 'src/features/**/model/**'
      instructions: '비즈니스 로직과 상태 관리입니다. 상태 설계, 커스텀 훅 패턴을 검토해주세요.'
    - path: '**/*.test.{ts,tsx}'
      instructions: '테스트 코드입니다. 테스트 커버리지와 엣지 케이스 처리를 검토해주세요.'
    - path: 'src/shared/configs/**'
      instructions: '설정 파일입니다. 설정값의 적절성과 일관성을 검토해주세요.'

  # 리뷰에서 제외할 파일 패턴
  path_filters:
    - '!**/*.lock'
    - '!**/dist/**'
    - '!**/.husky/**'
    - '!**/node_modules/**'

  # 라벨 자동 적용 지침
  labeling_instructions:
    - label: '[유형] 설정'
      instructions: '빌드 설정, 린트 설정, CI/CD, 환경 변수 등 프로젝트 환경 설정 관련 변경이 포함된 PR에 적용합니다.'
    - label: '[유형] 문서화'
      instructions: 'README, 주석, JSDoc, 가이드 문서 등 문서 작성 또는 수정이 포함된 PR에 적용합니다.'
    - label: '[유형] 테스트'
      instructions: '테스트 코드 작성, 수정, 테스트 커버리지 개선이 포함된 PR에 적용합니다.'
    - label: '[유형] 핫픽스'
      instructions: '프로덕션에서 발생한 긴급한 버그를 수정하는 PR에 적용합니다. 일반 버그 수정은 "[유형] 버그"를 사용합니다.'
    - label: '[유형] 버그'
      instructions: '버그 수정이 포함된 PR에 적용합니다. 긴급하지 않은 일반적인 버그 수정에 사용합니다.'
    - label: '[유형] 신규 기능'
      instructions: '새로운 기능, 새로운 컴포넌트, 새로운 페이지 등 기존에 없던 기능을 추가하는 PR에 적용합니다.'
    - label: '[유형] 리팩토링'
      instructions: '기능 변경 없이 코드 구조 개선, 성능 최적화, 코드 정리 등을 수행하는 PR에 적용합니다.'
    - label: '[유형] 기능 개선'
      instructions: '기존 기능의 개선, UX 향상, 기존 컴포넌트 업데이트 등이 포함된 PR에 적용합니다.'

chat:
  auto_reply: true

knowledge_base:
  # 코드 컨벤션 파일을 학습하여 리뷰에 반영
  code_guidelines:
    enabled: true
    filePatterns:
      - '**/.cursor/rules/**'
